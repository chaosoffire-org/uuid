name: Fuzz

on:
  workflow_dispatch:
    inputs:
      fuzz_time:
        description: 'Fuzz test duration'
        default: '5m'
        type: string
  workflow_call:
    inputs:
      fuzz_time:
        required: true
        type: string

permissions:
  contents: read

jobs:
  fuzz:
    name: Fuzz ${{ matrix.target }}
    runs-on: ubuntu-latest
    strategy:
      matrix:
        target:
          - FuzzParse
          - FuzzParseBytes
          - FuzzFromBytes
          - FuzzUnmarshalText
          - FuzzUnmarshalBinary
          - FuzzScan
          - FuzzNullUUIDScanString
          - FuzzNullUUIDScanBytes
          - FuzzNewRandom
    steps:
      - name: Checkout repository
        uses: actions/checkout@v6

      - name: Setup Go
        uses: actions/setup-go@v6
        with:
          go-version: stable
          cache: true

      - name: Restore fuzz cache
        uses: actions/cache@v5
        with:
          path: ~/.cache/go-build/fuzz
          key: fuzz-${{ matrix.target }}-${{ github.sha }}
          restore-keys: fuzz-${{ matrix.target }}-

      - name: Run fuzz test
        run: go test -fuzz="^${{ matrix.target }}$" -fuzztime=${{ inputs.fuzz_time }} ./internal/
