# Trigger fuzz tests on schedule and PR

name: Fuzz Trigger

on:
  pull_request:
    branches: [main]
  schedule:
    - cron: '35 14 * * *'  # Daily at 14:35 UTC

permissions:
  contents: read

jobs:
  check-activity:
    name: Check activity
    runs-on: ubuntu-latest
    if: github.event_name == 'schedule'
    outputs:
      should_run: ${{ steps.check.outputs.should_run }}
    steps:
      - uses: actions/checkout@v6
        with:
          fetch-depth: 2
      - name: Check for commits in last 24h
        id: check
        run: |
          LAST_COMMIT=$(git log -1 --format=%ct)
          NOW=$(date +%s)
          if [ $((NOW - LAST_COMMIT)) -lt 86400 ]; then
            echo "should_run=true" >> $GITHUB_OUTPUT
          else
            echo "should_run=false" >> $GITHUB_OUTPUT
            echo "No commits in last 24h, skipping fuzz tests"
          fi

  fuzz-pr:
    name: Fuzz (PR)
    if: github.event_name == 'pull_request'
    uses: ./.github/workflows/fuzz.yml
    with:
      fuzz_time: '10s'

  fuzz-scheduled:
    name: Fuzz (Scheduled)
    needs: check-activity
    if: github.event_name == 'schedule' && needs.check-activity.outputs.should_run == 'true'
    uses: ./.github/workflows/fuzz.yml
    with:
      fuzz_time: '5m'
